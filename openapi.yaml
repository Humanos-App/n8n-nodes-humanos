openapi: 3.0.0
paths:
  /v1/request:
    get:
      description: >-
        Retrieve a paginated list of credential requests for your organization

        You can filter requests by active status, search by name, filter by
        subject ID or agent ID, and paginate through results.

        Each request includes information about the credentials, subjects
        (users), security level, and creation date.
      operationId: getRequests
      parameters:
        - name: pageIndex
          required: false
          in: query
          description: Page number
          schema:
            default: 0
            example: 0
            type: number
        - name: pageSize
          required: false
          in: query
          description: Number of items per page
          schema:
            minimum: 5
            maximum: 100
            default: 10
            example: 10
            type: number
        - name: search
          required: false
          in: query
          description: Search query to filter by name. Case-insensitive partial match.
          schema:
            maxLength: 120
            example: example
            type: string
        - name: subjectDid
          required: false
          in: query
          description: Filter requests by subject DID.
          schema:
            example: did:via:humanos:user-123
            type: string
        - name: subjectContact
          required: false
          in: query
          description: Filter requests by subject contact (email or phone).
          schema:
            example: user@example.com
            type: string
        - name: subjectInternalId
          required: false
          in: query
          description: Filter requests by subject internal ID.
          schema:
            example: internal-user-12345
            type: string
        - name: agentDid
          required: false
          in: query
          description: Filter by agent DID.
          schema:
            example: did:via:humanos:agent-123
            type: string
        - name: securityLevel
          required: false
          in: query
          description: Filter by security level. Can be a single value or array
          examples:
            - CONTACT
            - - CONTACT
              - ORGANIZATION_KYC
          schema:
            type: array
            items:
              type: string
              enum:
                - CONTACT
                - ORGANIZATION_KYC
                - HUMANOS_KYC
                - HUMANOS_REVALIDATION
        - name: dateFrom
          required: false
          in: query
          description: Filter from date (will be converted to start of day)
          schema:
            format: date-time
            example: '2025-01-01'
            type: string
        - name: dateTo
          required: false
          in: query
          description: Filter to date (will be converted to end of day). Requires dateFrom.
          schema:
            format: date-time
            example: '2025-12-31'
            type: string
      responses:
        '200':
          description: >-
            Returns a paginated result with an array of credential request items
            and the total number of pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRequestsResponseDto'
      summary: Get
      tags:
        - Requests
    post:
      description: |-
        Create a new credential request for one or more subjects (users).

        This endpoint will:
           Create credentials from resources or inline JSON data
           Associate credentials with subjects
           Generate and send OTPs for approval via email or SMS

        Request details:
           Resources can be specified via group IDs, resource IDs, or as inline JSON credentials
           Maximum 30 credentials per request
           Maximum 20 contacts per request
           OTPs are automatically sent to all subjects after creation
      operationId: generate
      parameters: []
      requestBody:
        required: true
        description: >-
          Request body containing contacts (subjects), security level, and
          resources to create credentials from.

          Resources can be specified via groupIds, resourcesIds, or inline
          credentials array.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequestDto'
            examples:
              withResources:
                summary: Request with existing resources
                value:
                  contacts:
                    - user@example.com
                    - '+351912345678'
                  securityLevel: CONTACT
                  groupIds:
                    - 507f1f77bcf86cd799439011
                  resourcesIds:
                    - 507f1f77bcf86cd799439012
              withJsonCredentials:
                summary: Request with inline JSON credentials
                value:
                  contacts:
                    - user@example.com
                  securityLevel: CONTACT
                  credentials:
                    - scope: payments.hotel
                      type: document
                      name: Hotel Booking Confirmation
                      data:
                        - type: string
                          label: Hotel Name
                          value: Grand Hotel
                          hidden: false
                        - type: date
                          label: Check In
                          value: '2025-02-01'
                          hidden: false
                        - type: date
                          label: Check Out
                          value: '2025-02-05'
                          hidden: false
              minimal:
                summary: Minimal request
                value:
                  contacts:
                    - user@example.com
                  securityLevel: CONTACT
                  resourcesIds:
                    - 507f1f77bcf86cd799439012
      responses:
        '200':
          description: >-
            Returns the request ID, list of subjects (with their DIDs), and list
            of created credentials (with IDs, names, and internal IDs).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRequestResponseDto'
        '400':
          description: |-
            Bad request. This can occur when:
              (1) No resources found (must provide at least one resource via groupIds, resourcesIds, or credentials)
              (2) Maximum credentials exceeded (max 10 credentials allowed)
              (3) Issuer key not found
              (4) Contact not found
              (5) Invalid request data, or
              (6) Other validation errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 404
                  message:
                    type: string
                    example: Failed to generate credentials request
                  error:
                    type: string
                    example: Not Found
      summary: Create
      tags:
        - Requests
  /v1/request/{requestId}:
    get:
      description: >-
        Retrieve detailed information about a specific credential request

        This includes complete W3C Verifiable Credential data for each
        credential, subject information, agent details (if applicable), and
        issuer information

        The credentials are returned in W3C-compliant format and can be
        cryptographically verified
      operationId: getRequestDetail
      parameters:
        - name: requestId
          required: true
          in: path
          description: >-
            Unique identifier of the credential request. Must be a valid MongoDB
            ObjectId.
          schema:
            example: 507f1f77bcf86cd799439011
            type: string
      responses:
        '200':
          description: >-
            Returns complete information including W3C Verifiable Credentials,
            subjects, agent (if applicable), and issuer details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRequestDetailResponseDto'
              example:
                id: 507f1f77bcf86cd799439011
                name: Employee Onboarding Request
                createdAt: '2025-01-15T10:30:00Z'
                securityLevel: CONTACT
                credentials: []
                subjects: []
        '404':
          description: >-
            Request not found. This occurs when the request ID does not exist,
            the request belongs to another organization, or the request has been
            canceled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 404
                  message:
                    type: string
                    example: Request not found
                  error:
                    type: string
                    example: Not Found
      summary: Get Detail
      tags:
        - Requests
    delete:
      description: >-
        This action will cancel a credential request, by setting the canceledAt
        timestamp on the request.

        This operation is irreversible, and will prevent the request from being
        processed further by the subjects
      operationId: cancelRequest
      parameters:
        - name: requestId
          required: true
          in: path
          description: >-
            Unique identifier of the credential request to cancel. Must be a
            valid MongoDB ObjectId.
          schema:
            example: 507f1f77bcf86cd799439011
            type: string
      responses:
        '200':
          description: Returns true to confirm the cancellation.
          content:
            application/json:
              schema:
                type: boolean
        '404':
          description: >-
            The request ID does not exist, belongs to another organization or
            has already been canceled
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 404
                  message:
                    type: string
                    example: Request not found or already canceled
                  error:
                    type: string
                    example: Not Found
      summary: Cancel
      tags:
        - Requests
  /v1/request/resend/{subjectOtpId}:
    patch:
      description: >
        Resend a One-Time Password (OTP) to a subject for credential approval, 
        via email or SMS (depending on their contact type) with a code and a
        signing URL


        The endpoint validates:
          The request is not canceled
          Maximum attempts have not been reached, only successful OTP sends count towards resend limits
          Sufficient time has passed since the last successful resend
          Billing restrictions apply
      operationId: resendOtp
      parameters:
        - name: subjectOtpId
          required: true
          in: path
          description: >-
            Unique identifier of the SubjectOTP record. This ID is associated
            with a specific subject (user) and credential request. Must be a
            valid MongoDB ObjectId.
          schema:
            example: 507f1f77bcf86cd799439011
            type: string
      responses:
        '200':
          description: Returns true if the OTP was sent successfully via email or SMS.
          content:
            application/json:
              schema:
                type: boolean
      summary: Resend OTP
      tags:
        - Requests
  /v1/resource:
    get:
      description: |-
        Retrieve a paginated list of resources for your organization. 
              Resources can be documents, consents, forms. 
              You can filter resources by type, search by name, filter by active status, and paginate through results. 
              Only non-deleted resources are returned.
      operationId: getResources
      parameters:
        - name: pageIndex
          required: false
          in: query
          description: Page number
          schema:
            default: 0
            example: 0
            type: number
        - name: pageSize
          required: false
          in: query
          description: Number of items per page
          schema:
            minimum: 5
            maximum: 100
            default: 10
            example: 10
            type: number
        - name: search
          required: false
          in: query
          description: Search query to filter by name. Case-insensitive partial match.
          schema:
            maxLength: 120
            example: example
            type: string
        - name: active
          required: false
          in: query
          description: Filter by active status. Accepts true/false as string or boolean.
          schema:
            example: true
            type: boolean
        - name: types
          required: false
          in: query
          description: >-
            Filter by resource type. Can be a single value or array. Valid
            values: CONSENT, FORM, DOCUMENT
          schema:
            example:
              - DOCUMENT
            type: array
            items:
              type: string
              enum:
                - CONSENT
                - FORM
                - DOCUMENT
                - JSON
      responses:
        '200':
          description: >-
            Successfully retrieved resources. Returns a paginated result with an
            array of resource items and the total number of pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResourcesResponseDto'
      summary: Get Resources
      tags:
        - Resource
  /v1/resource/group:
    get:
      description: >-
        Retrieve a paginated list of resource groups (saved groups) for your
        organization. 
              Resource groups allow you to organize multiple resources together. 
              You can filter groups by active status, search by group name or resource name, filter by resource types, and paginate through results.
              Each group includes its associated resources.
      operationId: getGroups
      parameters:
        - name: pageIndex
          required: false
          in: query
          description: Page number
          schema:
            default: 0
            example: 0
            type: number
        - name: pageSize
          required: false
          in: query
          description: Number of items per page
          schema:
            minimum: 5
            maximum: 100
            default: 10
            example: 10
            type: number
        - name: search
          required: false
          in: query
          description: Search query to filter by name. Case-insensitive partial match.
          schema:
            maxLength: 120
            example: example
            type: string
        - name: active
          required: false
          in: query
          description: Filter by active status. Accepts true/false as string or boolean.
          schema:
            example: true
            type: boolean
        - name: types
          required: false
          in: query
          description: >-
            Filter by resource type. Can be a single value or array. Valid
            values: CONSENT, FORM, DOCUMENT
          schema:
            example:
              - DOCUMENT
            type: array
            items:
              type: string
              enum:
                - CONSENT
                - FORM
                - DOCUMENT
                - JSON
      responses:
        '200':
          description: >-
            Successfully retrieved resource groups. Returns a paginated result
            with an array of group items (each containing its resources) and the
            total number of pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGroupResourcesResponseDto'
      summary: Get Groups
      tags:
        - Resource
  /v1/user:
    get:
      description: >-
        Retrieves detailed information about a user by their contact,
        contactDid, or internalId. Exactly one search parameter must be
        provided. Returns contact information, identity data (if available), and
        the internal ID assigned by the organization.
      operationId: getSubject
      parameters:
        - name: contact
          required: false
          in: query
          description: Contact value (email or phone) to search for the user
          schema:
            example: user@example.com
            type: string
        - name: contactDid
          required: false
          in: query
          description: DID associated with the contact to search for the user
          schema:
            example: did:via:humanos:user-abc123
            type: string
        - name: internalId
          required: false
          in: query
          description: Internal ID assigned by the organization to search for the user
          schema:
            example: internal-user-12345
            type: string
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubjectResponseDto'
        '400':
          description: >-
            Invalid request parameters. Exactly one of contact, contactDid, or
            internalId must be provided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 400
                  message:
                    type: string
                    example: No subjects provided
                  error:
                    type: string
                    example: Bad Request
        '404':
          description: User not found or not accessible by this organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 404
                  message:
                    type: string
                    example: User not found
                  error:
                    type: string
                    example: Not Found
      summary: Get User
      tags:
        - User
    post:
      description: >-
        This endpoint allows organizations to import their existing users into
        Humanos. Multiple users can be created in a single request. A user can
        be created with just a contact (email or phone). Optionally, additional
        identity information (KYC) can be included. Optionally, organizations
        can attach an internal Id to allow mapping users within their database.
      operationId: create
      parameters: []
      requestBody:
        required: true
        description: >-
          Array of subjects to create. Each subject represents a user to be
          imported into Humanos. Minimum 1 subject, maximum 100 subjects per
          request. Each subject must have at least a contact (email or phone).
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateSubjectDto'
            examples:
              default:
                value:
                  - contact: user@example.com
                    internalId: internal-user-123
                    identity:
                      fullName: John Doe
                      birth: '1990-01-01'
                      docId: '1234567890'
                      countryAlpha3: PRT
                  - contact: '+351912345678'
                    internalId: internal-user-456
                summary: Example request with multiple users
      responses:
        '200':
          description: >-
            Request processed successfully. Returns an array of feedback
            objects, one for each subject in the request. The order of feedback
            items matches the order of subjects in the request. Each feedback
            contains a status code and optional data with user information.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreateSubjectFeedbackDto'
        '400':
          description: >-
            Bad request. This occurs when: no subjects are provided (empty
            array), more than 100 subjects are provided, or the request body is
            malformed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 400
                  message:
                    type: string
                    example: No subjects provided
                  error:
                    type: string
                    example: Bad Request
      summary: Create User
      tags:
        - User
  /v1/credential/{credentialId}:
    get:
      description: >-
        Retrieve a specific credential by its ID

        Returns the W3C Verifiable Credential data structure including
        cryptographic proofs

        Optionally includes the PDF content for document-type credentials
      operationId: getCredential
      parameters:
        - name: credentialId
          required: true
          in: path
          description: >-
            Unique identifier of the credential. Must be a valid MongoDB
            ObjectId.
          schema:
            example: 507f1f77bcf86cd799439011
            type: string
        - name: includePdf
          required: false
          in: query
          description: Whether to include the PDF content for document-type credentials
          schema:
            default: false
            example: false
            type: boolean
      responses:
        '200':
          description: >-
            Returns the W3C Verifiable Credential structure with optional PDF
            content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponseDto'
        '404':
          description: >-
            Credential not found. This occurs when the credential ID does not
            exist or belongs to another organization.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 404
                  message:
                    type: string
                    example: Credential not found for issuer
                  error:
                    type: string
                    example: Not Found
      summary: Get Credential
      tags:
        - Credentials
  /health:
    get:
      description: >-
        Returns the health status of the API service, including database, KMS,
        and S3 connectivity.
      operationId: healthCheck
      parameters: []
      responses:
        '200':
          description: Service is healthy
        '503':
          description: Service is unhealthy
      summary: Health check
      tags:
        - Health
info:
  title: Humanos API
  description: Humanos App Backend API
  version: '1.0'
  contact: {}
tags:
  - name: humanosApp
    description: ''
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RequestQuery:
      type: object
      properties:
        pageIndex:
          type: number
          description: Page number
          example: 0
          default: 0
        pageSize:
          type: number
          description: Number of items per page
          example: 10
          minimum: 5
          maximum: 100
          default: 10
        search:
          type: string
          description: Search query to filter by name. Case-insensitive partial match.
          example: example
          maxLength: 120
        subjectDid:
          type: string
          description: Filter requests by subject DID.
          example: did:via:humanos:user-123
        subjectContact:
          type: string
          description: Filter requests by subject contact (email or phone).
          example: user@example.com
        subjectInternalId:
          type: string
          description: Filter requests by subject internal ID.
          example: internal-user-12345
        agentDid:
          type: string
          description: Filter by agent DID.
          example: did:via:humanos:agent-123
        securityLevel:
          type: array
          description: Filter by security level. Can be a single value or array
          examples:
            - CONTACT
            - - CONTACT
              - ORGANIZATION_KYC
          items:
            type: string
            enum:
              - CONTACT
              - ORGANIZATION_KYC
              - HUMANOS_KYC
              - HUMANOS_REVALIDATION
        dateFrom:
          format: date-time
          type: string
          description: Filter from date (will be converted to start of day)
          example: '2025-01-01'
        dateTo:
          format: date-time
          type: string
          description: Filter to date (will be converted to end of day). Requires dateFrom.
          example: '2025-12-31'
    CredentialItemDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the credential
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: Name of the credential
          example: Identity Document
        resourceType:
          type: string
          description: Type of resource for this credential (e.g., DOCUMENT, CONSENT, FORM)
          example: DOCUMENT
          nullable: true
        internalId:
          type: string
          description: Internal ID of the credential (if provided during creation)
          example: internal-credential-123
          nullable: true
        status:
          type: string
          description: Status of the credential
          example: PENDING
          enum:
            - PENDING
            - APPROVED
            - REJECTED
            - REVOKED
      required:
        - id
        - status
    SubjectItemDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the subject if exists and accessible
          example: John Doe
        did:
          type: string
          description: Decentralized Identifier (DID) of the contact
          example: did:via:humanos:user-123
        contact:
          type: string
          description: Contact of the subject (email or phone)
          example: user@example.com
      required:
        - did
        - contact
    CredentialRequestItemDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the request
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: Name of the credential request
          example: Employee Onboarding Request
          nullable: true
        securityLevel:
          type: string
          description: Identity level required for all subjects in this request
          example: CONTACT
          enum:
            - CONTACT
            - ORGANIZATION_KYC
            - HUMANOS_KYC
            - HUMANOS_REVALIDATION
        credentials:
          description: List of credentials included in this request
          type: array
          items:
            $ref: '#/components/schemas/CredentialItemDto'
        subjects:
          description: List of subjects (users) associated with this request
          example:
            - id: 507f1f77bcf86cd799439011
              name: John Doe
              did: did:via:humanos:user-123
              contact: user@example.com
          type: array
          items:
            $ref: '#/components/schemas/SubjectItemDto'
        createdAt:
          type: string
          description: Date and time of the request creation
          example: '2025-01-15T10:30:00Z'
          format: date-time
      required:
        - id
        - securityLevel
        - credentials
        - subjects
        - createdAt
    GetRequestsResponseDto:
      type: object
      properties:
        data:
          description: Array of credential requests matching the query parameters
          example:
            id: 507f1f77bcf86cd799439011
            name: Employee Onboarding Request
            securityLevel: CONTACT
            credentials:
              - name: Identity Document
                resourceType: DOCUMENT
            subjects:
              - id: 507f1f77bcf86cd799439011
                name: John Doe
                did: did:via:humanos:user-123
                contact: user@example.com
          type: array
          items:
            $ref: '#/components/schemas/CredentialRequestItemDto'
        totalPages:
          type: number
          description: >-
            Total number of pages available based on the page size and total
            count
          example: 5
      required:
        - data
        - totalPages
    CredentialW3CDto:
      type: object
      properties:
        '@context':
          type: object
          description: JSON-LD context for the W3C Verifiable Credential
          example:
            - https://www.w3.org/ns/credentials/v2
        id:
          type: string
          description: Unique identifier for the credential
          example: https://example.com/credentials/123
        type:
          type: object
          description: Type of the credential
          example:
            - VerifiableCredential
        issuer:
          type: string
          description: Issuer of the credential (DID)
          example: did:via:humanos:issuer-123
        issuanceDate:
          type: string
          description: VC 1.1 issuance date (deprecated, use validFrom)
          example: '2025-01-15T10:30:00Z'
        expirationDate:
          type: string
          description: VC 1.1 expiration date (deprecated, use validUntil)
          example: '2026-01-15T10:30:00Z'
        validFrom:
          type: string
          description: VC 2.0 valid from date
          example: '2025-01-15T10:30:00Z'
        validUntil:
          type: string
          description: VC 2.0 valid until date
          example: '2026-01-15T10:30:00Z'
        credentialSubject:
          type: object
          description: Credential subject containing the actual credential data
          example:
            id: did:via:humanos:user-123
            name: John Doe
        proof:
          description: Cryptographic proof(s) for the credential
          example:
            - proofValue: z6Mk...
          type: array
          items:
            type: string
        name:
          type: string
          description: Name of the credential
          nullable: true
        resourceType:
          type: string
          description: Resource type of the credential
          nullable: true
        status:
          type: string
          description: Status of the credential
          example: PENDING
        required:
          type: boolean
          description: Whether the credential is required
          example: true
      required:
        - '@context'
        - id
        - type
        - credentialSubject
    CredentialDetailDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the credential
