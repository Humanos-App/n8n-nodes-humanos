    IdentityDto:
      type: object
      properties:
        fullName:
          type: string
          description: Full name of the person. Maximum 200 characters.
          example: John Doe
          maxLength: 200
        birth:
          type: string
          description: >-
            Birth date. Must be a valid date in the past. Format: YYYY-MM-DD or
            ISO 8601.
          example: '1990-01-01'
          format: date
        docId:
          type: string
          description: >-
            Document ID number. Maximum 50 characters. Spaces will be
            automatically removed.
          example: '1234567890'
          maxLength: 50
        fullDocId:
          type: string
          description: >-
            Full document ID (extended version). Must start with docId and
            contain additional characters. Maximum 50 characters. Spaces will be
            automatically removed.
          example: '12345678901234'
          maxLength: 50
        countryAlpha3:
          type: string
          description: >-
            3-letter ISO 3166-1 alpha-3 country code (e.g., PRT, USA, GBR). Must
            be exactly 3 characters. Spaces will be automatically removed.
          example: PRT
          minLength: 3
          maxLength: 3
        gender:
          type: string
          description: Gender. Maximum 50 characters.
          example: M
          maxLength: 50
        expiresAt:
          type: string
          description: 'Document expiration date. Format: YYYY-MM-DD or ISO 8601.'
          example: '2025-01-01'
          format: date
        issueDate:
          type: string
          description: 'Document issue date. Format: YYYY-MM-DD or ISO 8601.'
          example: '2010-01-01'
          format: date
        taxNumber:
          type: string
          description: Tax identification number. Maximum 50 characters.
          example: '123456789'
          maxLength: 50
        healthNumber:
          type: string
          description: Health insurance number. Maximum 50 characters.
          example: '987654321'
          maxLength: 50
        socialSecurityNumber:
          type: string
          description: Social security number. Maximum 50 characters.
          example: '111222333'
          maxLength: 50
        photo:
          type: string
          description: >-
            Photo of the person (base64 encoded or URL). Maximum 2000
            characters.
          example: data:image/jpeg;base64,/9j/4AAQSkZJRg...
          maxLength: 2000
        height:
          type: string
          description: Height of the person. Maximum 50 characters.
          example: 175 cm
          maxLength: 50
        documentType:
          type: string
          description: >-
            Type of document (e.g., passport, ID card, driver license). Maximum
            50 characters.
          example: passport
          maxLength: 50
        documentDiscriminator:
          type: string
          description: Document discriminator. Maximum 50 characters.
          example: A
          maxLength: 50
        placeOfBirth:
          type: string
          description: Place of birth. Maximum 50 characters.
          example: Lisbon
          maxLength: 50
        mrzText:
          type: string
          description: >-
            Machine Readable Zone (MRZ) text from the document. Maximum 2000
            characters.
          example: P<PRTDOE<<JOHN<<<<<<<<<<<<<<<<<<<<<<<<<
          maxLength: 2000
        extra:
          type: string
          description: >-
            Additional extra information in JSON format. Maximum 2000
            characters.
          example: '{"notes": "Additional information"}'
          maxLength: 2000
      required:
        - fullName
        - birth
        - docId
        - countryAlpha3
    CreateSubjectDto:
      type: object
      properties:
        contact:
          type: string
          description: >-
            Contact information for the user. Must be a valid email address or
            phone number (e.g., "user@example.com" or "+351912345678"). Spaces
            will be automatically removed from the contact value. This is the
            only required field.
          example: user@example.com
        identity:
          description: >-
            Optional identity information (KYC data) for the user. When
            provided, all identity fields will be validated. Required fields if
            identity is provided: fullName, birth, docId, countryAlpha3.
          allOf:
            - $ref: '#/components/schemas/IdentityDto'
        internalId:
          type: string
          description: >-
            Optional internal identifier that allows organizations to map users
            within their own database. This ID is stored and can be used to
            reference the user in subsequent API calls. Useful for maintaining a
            link between your internal user records and the Humanos user
            records.
          example: internal-user-12345
      required:
        - contact
    SubjectDidDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the DID record
          example: 507f1f77bcf86cd799439011
        did:
          type: string
          description: >-
            Full DID string following W3C DID standard (e.g.,
            did:via:humanos:user-123)
          example: did:via:humanos:user-123
        active:
          type: boolean
          description: Whether the DID is currently active
          example: true
        revoked:
          type: boolean
          description: Whether the DID has been revoked
          example: false
      required:
        - id
        - did
        - active
        - revoked
    SubjectDataDto:
      type: object
      properties:
        contact:
          type: string
          description: Contact value (email or phone) for the created or updated user
          example: user@example.com
        internalId:
          type: string
          description: >-
            Internal ID provided by the organization, if any. This is the same
            internalId that was sent in the request, allowing you to map the
            response back to your internal records.
          example: internal-user-12345
          nullable: true
        did:
          description: >-
            Decentralized Identifier (DID) associated with the user. This is a
            unique identifier following the W3C DID standard that can be used
            for cryptographic operations.
          allOf:
            - $ref: '#/components/schemas/SubjectDidDto'
      required:
        - contact
        - did
    CreateSubjectFeedbackDto:
      type: object
      properties:
        status:
          type: number
          description: >-
            HTTP status code indicating the result of the operation for this
            specific subject:

            - 200: Success

            - 400: Invalid contact

            - 401: Invalid identity

            - 402: Invalid country

            - 407: Duplicate contact in request

            - 408: Duplicate identity in request

            - 409: Identity already exists for another user

            - 410: Identity already exists for this user
          example: 200
          enum:
            - 200
            - 400
            - 401
            - 402
            - 407
            - 408
            - 409
            - 410
        data:
          description: >-
            Response data containing user information if the operation was
            successful (status 200), or null if there was an error. When status
            is 200, this object contains contact, internalId (if provided), and
            the DID information.
          nullable: true
          example:
            contact: user@example.com
            internalId: internal-user-12345
            did:
              id: 507f1f77bcf86cd799439012
              did: did:via:humanos:user-123
              active: true
              revoked: false
          allOf:
            - $ref: '#/components/schemas/SubjectDataDto'
        contact:
          type: string
          description: Internal ID of the subject
          example: internal-user-12345
          nullable: true
        message:
          type: string
          description: Success message or error message
          examples:
            - Subject created
            - This call contained this contact more than once
          nullable: true
      required:
        - status
    CredentialResponseDto:
      type: object
      properties:
        credential:
          type: object
          description: W3C Verifiable Credential in JSON-LD format
          example:
            '@context':
              - https://www.w3.org/ns/credentials/v2
              - https://humanos.id/schemas/credential/v1
            id: https://humanos.id/credentials/crd_abc123
            type:
              - VerifiableCredential
            issuer: did:web:humanos.id
            issuanceDate: '2025-01-01T00:00:00Z'
            validFrom: '2025-01-01T00:00:00Z'
            validUntil: '2026-01-01T00:00:00Z'
            credentialSubject:
              id: did:key:z6MkExample123
              data:
                - label: pdf
                  type: pdf
                  value: JVBERi0xLjQKJeLjz9...
                  hidden: false
            proof:
              - type: DataIntegrityProof
                cryptosuite: eddsa-jcs-2022
                proofPurpose: assertionMethod
                verificationMethod: did:web:humanos.id#key-1
                proofValue: >-
                  z58DAdFfa9SkqZMVPxAQpic7ndSayn1PzZs6ZjWp1CktyGesjuTSwRdoWhAfGFCF5bppETSTojQCrfFPP2oumHKtz
                actionType: CREATE
                actionProof: '0x1234567890abcdef'
                createdAt: '2025-01-01T00:00:00Z'
        internalId:
          type: string
          description: Internal identifier for the credential within the organization
          example: EMP-2024-001
        pdf:
          type: string
          description: >-
            Base64-encoded PDF document (only included when includePdf=true and
            resource type is DOCUMENT)
          example: JVBERi0xLjQKJeLjz9...
      required:
        - credential
